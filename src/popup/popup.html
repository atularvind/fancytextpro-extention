<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FancyTextPro</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" id="brand" target="_blank" rel="noopener" data-i18n-title="openSite">
        <img src="../icons/mark.svg" alt="" width="22" height="22" />
        <span>FancyTextPro</span>
      </a>
      <button id="openOptions" class="icon-btn on-brand" type="button" data-i18n-aria-label="settings" data-i18n-title="settings">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.53 1.53 0 01-2.29.95c-1.37-.84-2.94.73-2.1 2.1.54.89.06 2.04-.95 2.29-1.56.38-1.56 2.6 0 2.98 1.01.25 1.49 1.4.95 2.29-.84 1.37.73 2.94 2.1 2.1a1.53 1.53 0 012.29.95c.38 1.56 2.6 1.56 2.98 0a1.53 1.53 0 012.29-.95c1.37.84 2.94-.73 2.1-2.1a1.53 1.53 0 01.95-2.29c1.56-.38 1.56-2.6 0-2.98a1.53 1.53 0 01-.95-2.29c.84-1.37-.73-2.94-2.1-2.1a1.53 1.53 0 01-2.29-.95zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
        </svg>
      </button>
    </header>

    <section class="compose">
      <label class="sr-only" for="input" data-i18n="inputLabel"></label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
        <textarea id="input" rows="1" spellcheck="false" autocomplete="off" data-i18n-placeholder="inputPlaceholder"></textarea>
        <button id="clearInput" class="icon-btn small" type="button" hidden data-i18n-aria-label="clearInput" data-i18n-title="clearInput">✕</button>
      </div>
      <div class="tools">
        <label class="sr-only" for="search" data-i18n="searchLabel"></label>
        <input id="search" type="search" autocomplete="off" spellcheck="false" aria-controls="list" data-i18n-placeholder="searchPlaceholder" />
        <button id="removeStyling" class="text-btn" type="button" hidden data-i18n="removeStyling"></button>
      </div>
      <div class="chips" id="chips" role="toolbar" data-i18n-aria-label="categories"></div>
      <p class="insert-hint" id="insertHint" hidden data-i18n="insertHint"></p>
    </section>

    <main id="list" class="list" tabindex="-1"></main>

    <footer class="foot">
      <nav class="foot-links" id="footLinks" data-i18n-aria-label="moreOnSite"></nav>
      <p class="tip" id="tip"></p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="row-template">
      <li class="row">
        <button type="button" class="row-main"><span class="name"></span><span class="preview" aria-hidden="true"></span></button>
        <div class="row-actions">
          <button type="button" class="act star">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.07 3.29a1 1 0 00.95.69h3.46c.97 0 1.37 1.24.59 1.81l-2.8 2.03a1 1 0 00-.36 1.12l1.07 3.29c.3.92-.76 1.69-1.54 1.12l-2.8-2.03a1 1 0 00-1.18 0l-2.8 2.03c-.78.57-1.84-.2-1.54-1.12l1.07-3.29a1 1 0 00-.36-1.12L2.98 8.72c-.78-.57-.38-1.81.59-1.81h3.46a1 1 0 00.95-.69l1.07-3.29z" /></svg>
          </button>
          <button type="button" class="act insert">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16 4v6a2 2 0 01-2 2H5m0 0l3-3m-3 3l3 3" /></svg>
          </button>
          <button type="button" class="act copy" tabindex="-1" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M9 2a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V6.414A2 2 0 0016.414 5L14 2.586A2 2 0 0012.586 2H9z" /><path d="M3 8a2 2 0 012-2v10h8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" /></svg>
          </button>
        </div>
      </li>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
